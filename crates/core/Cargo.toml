[package]
name = "acp-inspector-core"
version = "0.0.1"
description = "Headless core of the ACP Inspector: the connection contract, the stdio transport, the frame trace, and the typed ACP v1 client"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The typed layer's whole protocol dependency (docs/architecture.md §3): pure
# types under a versioned namespace, so decoding is explicitly *as v1* and the
# v2 seam is a second decoder rather than an excavation (§11 seam 1). The
# default features are the workspace's, and the rule is stated there: the
# canonical stable method list gates what this layer decodes (ADR 0008), and
# traffic outside the stable schema is displayed rather than decoded (§8).
agent-client-protocol-schema.workspace = true
# The spawn form's recent commands have to live somewhere the next launch of the
# app will look, and where that is is a platform's answer rather than this
# crate's (docs/architecture.md §15 q6).
dirs.workspace = true
futures-util.workspace = true
# The traits the two helpers above the envelope are written in terms of; the
# schema crate's types bring their own implementations.
serde.workspace = true
# The JSON-RPC envelope itself, which the schema crate does not own: ids,
# `params`, `result`, `error`. Frames are text on the wire and stay text in the
# trace (§8) — this is what the typed layer reads them *as*.
# Raw fragments let decode.rs own numeric interpretation before either numeric
# serde_json feature can change it, without changing unrelated Value readers.
serde_json = { workspace = true, features = ["raw_value"] }
# `process` and `io-util` are the stdio transport; `sync` is the channels the
# connection contract and the pending calls are made of; `rt` is the pumps
# behind them, and `macros` is the `select!` each pump is written with — a
# library feature, not a test one, however much it looks like the latter.
tokio = { workspace = true, features = [
    "process",
    "io-util",
    "macros",
    "rt",
    "sync",
] }
tokio-util.workspace = true

[dev-dependencies]
# The one question no agent can be driven to answer: whether the set of
# capabilities the display names by hand is still the whole stable set the
# protocol defines (`tests/capability.rs`).
schemars.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
