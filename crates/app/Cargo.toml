[package]
name = "acp-inspector"
version = "0.0.1"
description = "The ACP Inspector: strictly presentational screens over acp-inspector-core, one binary with a feature per renderer"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# One crate for every renderer, and a feature to pick one — the layout Dioxus's
# own default template uses and the one its tooling expects (`dx serve
# --desktop` is `cargo build --no-default-features --features desktop`). The
# screens are the same program whichever window they are drawn in; what differs
# is the shell around them, and that is small enough to gate rather than to
# split into a crate of its own
# (docs/adr/0011-one-ui-crate-a-feature-per-renderer.md).
#
# `desktop` is the default because it is the one that ships today. `web` is
# declared so the seam exists and is checked — `cargo check --no-default-features
# --features web` must keep compiling on a native target — but until core builds
# for `wasm32` it is a promise about the app crate and not yet a runnable
# surface (docs/architecture.md §1).
[features]
default = ["desktop"]
desktop = ["dioxus/desktop", "dep:open"]
web = ["dioxus/web"]

# State, rendering, form presentation, clocks and the answer's data format.
# No protocol client, and no async runtime of its own — `dioxus-desktop` runs its event
# loop inside a tokio runtime, and that is the one core's pumps spawn onto
# (docs/architecture.md §5).
[dependencies]
acp-inspector-core.workspace = true
base64 = "0.22"
url = "2"
# Desktop folder retrieval, with platform launcher exit errors observed in shell.rs.
open = { version = "5.3", optional = true }

dioxus.workspace = true
dioxus-field = { version = "0.7.0", default-features = false }
dioxus-free-icons.workspace = true
# Installed form controls use no routing. Keep the registry's optional router
# feature off; the complete installed widget source still compiles below.
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955", version = "0.0.1", default-features = false }
jiff.workspace = true
schemaform = "=0.5.0"
schemaform-dioxus = "=0.5.0"
# The elicitation panel, and only it (§7.8). An elicitation's answer *is* a JSON
# object by the protocol's definition, core's answer path is written in these
# types, and the raw tab is a text box a reader edits one in — so this window
# names the shape it is already handling instead of asking core for a JSON
# builder it would only be calling from here. Still nothing that speaks a
# protocol: this is a format, and the frames stay strings all the way through
# (`trace.rs`).
serde_json.workspace = true
serde.workspace = true
# The existing runtime supplies toast timers and off-thread, bounded reads of
# user-selected image files. No filesystem work runs on the UI executor.
tokio = { workspace = true, features = ["time", "rt"] }

# Renders a component to HTML with no window under it, so a test can assert on
# what a screen shows rather than on the value a helper returned.
[dev-dependencies]
dioxus-ssr.workspace = true
# Two tests click and submit into a rendered screen with hand-built events
# (`spawn.rs`, `permission.rs`), which needs the serialized event shapes this
# feature turns on. The desktop renderer turns it on itself, for its IPC, and
# the web one does not — so the test build says what it needs rather than
# borrow it from whichever renderer happens to be under it. Already in the
# graph under either, so this buys a feature and not a dependency.
dioxus-html = { workspace = true, features = ["serialize"] }
# For `examples/bundle-icon.rs` alone: the mark, written out at the sizes the
# macOS bundle's icon holds. Packaging, and no part of the program — a
# dev-dependency so that it never is.
png.workspace = true
