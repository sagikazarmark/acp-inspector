# What the application bundle says about itself, and nothing about the build.
#
# `dx bundle` is the one command that reads this file, and `just bundle-macos`
# is the one recipe that runs it (../docs/adr/0010-the-bundle-is-the-one-thing-dx-makes.md).
# `cargo build`, `cargo run` and `cargo test` never open it: nothing here is an
# asset, nothing is resolved at run time, and a checkout with this file deleted
# builds and runs exactly as before. The stylesheet is compiled in and the
# window icon is drawn in code, so the binary is already the whole program;
# this file is the plist and the Finder icon wrapped around it.

[application]
# The Finder name and `CFBundleName`. The crates are named `acp-inspector*`
# (../../docs/development.md, "Layout"); this is the name the *bundle* carries,
# and it is the one the window already puts in its title bar.
name = "ACP Inspector"

[bundle]
# `CFBundleIdentifier`. Permanent: macOS keys preferences, TCC grants,
# Keychain items and notarization history to it, so a change is a migration
# and not a rename. `acp-inspector` is already the slug of the state directory
# (crates/core/src/kept.rs) and the `clientInfo` name sent on `initialize`
# (crates/core/src/client.rs).
identifier = "dev.sagikazarmark.acp-inspector"
publisher = "Márk Sági-Kazár"
copyright = "Copyright 2026 Márk Sági-Kazár"
# `LSApplicationCategoryType` — public.app-category.developer-tools.
category = "DeveloperTool"
short_description = "Drive one ACP agent and see what crossed the wire"
long_description = """
A desktop tool that spawns one Agent Client Protocol agent, drives it through \
sessions and turns, and shows every JSON-RPC frame as it crossed the pipe — \
with the agent's stderr beside it and the specification's MUSTs annotated \
where the captured traffic decides them."""
# The bundles' icons are packaging assets under `bundle/`, committed, and written
# by `just icon` from the same drawing `src/mark.rs` puts in the window's own
# icon at 64px: an `.icns` on macOS's icon grid, folded by `iconutil`, for the
# macOS bundle; PNGs for the Linux package's icon theme; and an `.ico` for the
# Windows executable and installer. Each platform takes the formats it reads
# from this one list. They are deliberately not left out: without an icon, `dx`
# stamps the bundle with the renderer's own logo, which is the outcome
# `shell::icon()` exists to refuse.
icon = [
    "bundle/icon.icns",
    "bundle/32x32.png",
    "bundle/128x128.png",
    "bundle/256x256.png",
    "bundle/512x512.png",
    "bundle/icon.ico",
]
# The third-party licence notices, rendered by the `bundle-*` recipes into
# `dist/` before `dx` runs (a path from the repository root, where they run it):
# into `Contents/Resources` on macOS, beside the executable in the Linux
# package and the Windows installer.
resources = ["dist/THIRD_PARTY_LICENSES.html"]

[bundle.macos]
# `LSMinimumSystemVersion`, and the deployment target the binary is built for:
# `just bundle-macos` exports it as `MACOSX_DEPLOYMENT_TARGET`, and
# `scripts/check-macos-bundle.sh` fails the bundle if the linker's `minos`
# differs. 11.0 (Big Sur) because it is the oldest macOS on Apple Silicon, so
# both architectures get the same floor; wry/tao support older. Building inside
# the devenv shell stamps its SDK's 14.0 instead, which is why release bundles
# are built with Xcode's Command Line Tools (docs/development.md, "Releasing").
minimum_system_version = "11.0"
# Required for notarization. Signing itself is not configured here — an
# identity is a person's, not the project's — and is applied by `codesign` in
# the `just bundle-macos` recipe when one is passed (ADR 0010).
hardened_runtime = true
# No entitlements, and never App Sandbox: this tool's whole job is spawning an
# executable the reader named, in a directory the reader chose. The WebView
# runs in its own process, so no JIT or memory entitlement is owed either.

[bundle.deb]
# What the binary links at run time beyond libc, as Debian and Ubuntu name the
# packages: the WebView and its GTK, and libxdo, which `dioxus-desktop` links
# on Linux. The `.deb` is built on Ubuntu 22.04, so it installs there and on
# anything newer.
depends = ["libwebkit2gtk-4.1-0", "libgtk-3-0", "libxdo3"]
section = "devel"
# dx's own template names the app after the executable (`AcpInspector`), as it
# does the macOS bundle; this one is dx's with the product's name. A path from
# the repository root, where the `bundle-linux` recipe runs dx.
desktop_template = "crates/app/bundle/acp-inspector.desktop"

[bundle.windows.wix]
# Permanent, like the identifier: Windows recognises an upgrade by this code,
# and a changed one installs the new version beside the old. Set here so that
# renaming the product cannot change it.
upgrade_code = "ba7ce8cb-5d71-42ec-a605-cdfa8d729790"
