# cargo-dist (`dist`) configuration for the Linux and Windows archives (L5).
#
# **Nothing here publishes.** `ci` is empty, so `dist` generates no release
# workflow and nothing uploads; `just dist-plan` and `just dist-build` run it on
# the machine they are run on. The macOS release is `just bundle-macos`, which
# signs and notarizes a `.app`; these are plain archives of the binary.
#
# **Untested on CI.** The archives are built by hand, on the platform they are
# for (a Linux build needs the WebKitGTK development packages below; a Windows
# build needs the MSVC toolchain). The binary needs the same libraries at run
# time: WebKitGTK 4.1 on Linux, and WebView2 on Windows (present on current
# Windows 10 and 11). See docs/development.md, "Releasing".
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = []
installers = []
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

[dist.dependencies.apt]
"libwebkit2gtk-4.1-dev" = "*"
libxdo-dev = "*"
libssl-dev = "*"
